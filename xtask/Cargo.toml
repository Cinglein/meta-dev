[package]
name = "meta-xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
affected = { path = "../tooling/affected" }
corpus_check = { path = "../tooling/corpus_check" }
crate_graph = { path = "../tooling/lints/crate_graph" }
meta-schema = { path = "../crates/meta-schema" }
mutant_costs = { path = "../tooling/mutant_costs" }
mutation = { path = "../tooling/mutation" }
settings = { path = "../tooling/settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacked = { path = "../tooling/stacked" }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
thiserror = "2"
task = { path = "../tooling/task" }
test_time = { path = "../tooling/test_time" }
toml = "0.9"

[lints]
workspace = true

[dev-dependencies]
task = { path = "../tooling/task", features = ["test-policy"] }
