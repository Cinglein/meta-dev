[package]
name = "meta-xtask"
version = "0.6.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
affected = { path = "../tooling/affected" }
build_time = { path = "../tooling/build_time" }
corpus_check = { path = "../tooling/corpus_check" }
crate_graph = { path = "../tooling/lints/crate_graph" }
elegance = { path = "../tooling/elegance" }
git_starters = { path = "../tooling/lints/git_starters" }
meta-golden = { path = "../crates/meta-golden" }
meta-log = { path = "../crates/meta-log" }
meta-run = { path = "../crates/meta-run" }
meta-schema = { path = "../crates/meta-schema" }
meta-severity = { path = "../crates/meta-severity" }
meta-state = { path = "../crates/meta-state" }
mutant_costs = { path = "../tooling/mutant_costs" }
mutation = { path = "../tooling/mutation" }
settings = { path = "../tooling/settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stacked = { path = "../tooling/stacked" }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
test_budget = { path = "../tooling/lints/test_budget" }
thiserror = "2"
task = { path = "../tooling/task" }
test_time = { path = "../tooling/test_time" }
toml = "0.9"
toml_edit = "0.22"
waterfall = { path = "../tooling/waterfall" }

[lints]
workspace = true

[dev-dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
task = { path = "../tooling/task", features = ["test-policy"] }
