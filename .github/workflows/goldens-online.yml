name: goldens-online

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: goldens-online
  cancel-in-progress: false

jobs:
  gh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: gh --version
      - run: cargo xtask goldens-online
        env:
          GH_TOKEN: ${{ github.token }}
      - name: gh goldens match a fresh read-only recording (run `cargo xtask goldens-online` and commit the diff)
        run: git add --intent-to-add goldens && git diff --exit-code -- goldens
