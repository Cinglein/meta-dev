name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TMPDIR: /dev/shm

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target.noindex
            examples/consumer -> target.noindex
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-semver-checks@0.51.0
      - name: writeback sampler (diagnostic)
        run: |
          df -T /tmp /dev/shm "$GITHUB_WORKSPACE"
          findmnt -no FSTYPE,OPTIONS /
          findmnt -no FSTYPE,OPTIONS /dev/shm
          echo "TMPDIR=$TMPDIR"
          sysctl vm.dirty_ratio vm.dirty_background_ratio vm.dirty_expire_centisecs vm.dirty_writeback_centisecs
          (while :; do echo "wb $(date -u +%H:%M:%S.%N | cut -c1-12) $(grep -E '^(Dirty|Writeback):' /proc/meminfo | tr -s ' ' | tr '\n' ' ') $(cat /proc/pressure/io | tr '\n' ' ')"; sleep 0.2; done | tee -a "$RUNNER_TEMP/wb.log" | grep -q never-printed) &
      - run: cargo xtask ci ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
      - name: writeback samples (diagnostic)
        if: always()
        run: cat "$RUNNER_TEMP/wb.log"
      - run: cargo xtask ci
        working-directory: examples/consumer
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  git-count:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test-time
        env:
          META_GIT_COUNT: "1"
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  goldens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - &cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
      - run: git --version
      - run: cargo xtask goldens
      - name: goldens match a fresh recording (run `cargo xtask goldens` and commit the diff)
        run: git add --intent-to-add goldens && git diff --exit-code -- goldens

  build-time:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: target.noindex/build-time
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo build --workspace --all-targets --timings
      - run: cargo xtask waterfall "$CARGO_TARGET_DIR/cargo-timings/cargo-timing.html" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-timings
          path: target.noindex/build-time/cargo-timings
          retention-days: 30

  stacked:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - run: cargo xtask stacked
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  mutants-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - &mutants-checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - &mutants-toolchain
        run: rustup toolchain install
      - &mutants-linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants
          save-if: false
      - &mutants-tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - id: plan
        run: |
          shards=$(cargo xtask mutants-diff-plan)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
        env: &mutants-build-env
          CARGO_INCREMENTAL: 1

  mutants:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    env:
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - *mutants-checkout
      - *mutants-toolchain
      - *mutants-linker
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants
      - *mutants-tool
      - run: cargo xtask mutants
        timeout-minutes: 5
        env: *mutants-build-env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: target.noindex/mutants
          retention-days: 30

  mutant-costs:
    needs: [mutants-plan, mutants]
    if: ${{ !cancelled() && needs.mutants-plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: target.noindex/measured
      - run: cargo xtask mutant-costs target.noindex/measured | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  ci-gate:
    needs: [ci, git-count, goldens, build-time, stacked, mutants-plan, mutants, mutant-costs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1
          echo "every job passed or was not needed"
