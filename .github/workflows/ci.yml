name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/consumer -> target
      - run: cargo xtask ci ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || github.token }}
      - run: cargo xtask ci
        working-directory: examples/consumer
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || github.token }}

  goldens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo xtask goldens
      - name: goldens match a fresh recording (run `cargo xtask goldens` and commit the diff)
        run: git add --intent-to-add goldens && git diff --exit-code -- goldens

  stacked:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask stacked
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  mutants-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - &mutants-checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - &mutants-toolchain
        run: rustup toolchain install
      - &mutants-linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          save-if: false
      - &mutants-tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - id: plan
        run: |
          shards=$(cargo xtask mutants-diff-plan)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
        env: &mutants-build-env
          CARGO_INCREMENTAL: 1

  mutants:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    env:
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - *mutants-checkout
      - *mutants-toolchain
      - *mutants-linker
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - *mutants-tool
      - run: cargo xtask mutants
        timeout-minutes: 5
        env: *mutants-build-env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: target/mutants
          retention-days: 30

  mutant-costs:
    needs: [mutants-plan, mutants]
    if: ${{ !cancelled() && needs.mutants-plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: target/measured
      - run: cargo xtask mutant-costs target/measured | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  ci-gate:
    needs: [ci, goldens, stacked, mutants-plan, mutants, mutant-costs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1
          echo "every job passed or was not needed"
