name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: &tests-on-tmpfs
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target.noindex
            examples/consumer -> target.noindex
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-semver-checks@0.51.0
      - name: install gitleaks 8.30.1
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check --strict
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - run: cargo xtask ci ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}
      - run: cargo xtask ci
        working-directory: examples/consumer
        env:
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  git-count:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *tests-on-tmpfs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test-time
        env:
          META_GIT_COUNT: "1"
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  goldens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *tests-on-tmpfs
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - &cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
      - run: git --version
      - run: cargo xtask goldens
      - name: goldens match a fresh recording (run `cargo xtask goldens` and commit the diff)
        run: git add --intent-to-add goldens && git diff --exit-code -- goldens

  build-time:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo xtask build-time | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      # build-time runs the clean --timings build first, then the edit builds; the oldest report is the clean one.
      - run: |
          set -- target.noindex/build-time/cargo-timings/cargo-timing-*.html
          cargo xtask waterfall "$1" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-timings
          path: target.noindex/build-time/cargo-timings
          retention-days: 30

  stacked:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - run: cargo xtask stacked
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  mutants-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - &mutants-checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - &mutants-toolchain
        run: rustup toolchain install
      - &mutants-linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants
          save-if: false
      - &mutants-tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - id: plan
        run: |
          shards=$(cargo xtask mutants-diff-plan)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
        env: &mutants-build-env
          CARGO_INCREMENTAL: 1

  mutants:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    env:
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - *mutants-checkout
      - *mutants-toolchain
      - *mutants-linker
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants
      - *mutants-tool
      - run: cargo xtask mutants
        timeout-minutes: 5
        env: *mutants-build-env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: target.noindex/mutants
          retention-days: 30

  mutant-costs:
    needs: [mutants-plan, mutants]
    if: ${{ !cancelled() && needs.mutants-plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: target.noindex/measured
      - run: cargo xtask mutant-costs target.noindex/measured | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  ci-gate:
    needs: [ci, git-count, goldens, build-time, stacked, mutants-plan, mutants, mutant-costs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1
          echo "every job passed or was not needed"
