name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env: &tests-on-tmpfs
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target.noindex
            examples/consumer -> target.noindex
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-semver-checks@0.51.0,cargo-mutants@27.1.0
      - run: cargo xtask ci ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
      - run: cargo xtask ci
        working-directory: examples/consumer
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
      - run: cargo xtask stacked
        working-directory: examples/consumer
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
      - run: cargo xtask mutants
        working-directory: examples/consumer

  git-count:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *tests-on-tmpfs
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask test-time
        env:
          META_GIT_COUNT: "1"
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  macos:
    runs-on: macos-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target.noindex
      - run: cargo test -p meta-cli --all-features
        timeout-minutes: 5

  macos-mutants:
    runs-on: macos-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: [0/4, 1/4, 2/4, 3/4]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target.noindex
          shared-key: macos-mutants
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo mutants --config .cargo/mutants-macos.toml --shard ${{ matrix.shard }} --package meta-cli --in-place --test-package meta-cli --cargo-test-arg=--all-features --cargo-test-arg=process_table --file 'crates/meta-cli/src/request/local/local_clone/vetting/host/process_table/darwin.rs' --file 'crates/meta-cli/src/request/local/local_clone/vetting/host/process_table/darwin/*.rs'
        timeout-minutes: 5

  goldens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: *tests-on-tmpfs
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - &cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
      - run: git --version
      - run: cargo xtask goldens
      - name: goldens match a fresh recording (run `cargo xtask goldens` and commit the diff)
        run: git add --intent-to-add goldens && git diff --exit-code -- goldens

  build-time:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo xtask build-time | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      # build-time runs the clean --timings build first, then the edit builds; the oldest report is the clean one.
      - run: |
          set -- target.noindex/build-time/cargo-timings/cargo-timing-*.html
          cargo xtask waterfall "$1" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-timings
          path: target.noindex/build-time/cargo-timings
          retention-days: 30

  stacked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - run: cargo xtask stacked
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}

  mutants-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - &mutants-checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - &mutants-toolchain
        run: rustup toolchain install
      - &mutants-linker
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants
          save-if: false
      - &mutants-tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - id: plan
        run: |
          shards=$(cargo xtask mutants-diff-plan)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
        env: &mutants-build-env
          CARGO_INCREMENTAL: 1

  mutants:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    env:
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - *mutants-checkout
      - *mutants-toolchain
      - *mutants-linker
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants
      - *mutants-tool
      - run: cargo xtask mutants
        timeout-minutes: 5
        env: *mutants-build-env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: target.noindex/mutants
          retention-days: 30

  mutant-costs:
    needs: [mutants-plan, mutants]
    if: ${{ !cancelled() && needs.mutants-plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: target.noindex/measured
      - run: cargo xtask mutant-costs target.noindex/measured | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  ci-gate:
    needs: [ci, macos, macos-mutants, git-count, goldens, build-time, stacked, mutants-plan, mutants, mutant-costs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: every job passed; only mutants jobs may skip, and only when the plan has no shards
        env:
          NEEDS: ${{ toJSON(needs) }}
          SHARDS: ${{ needs.mutants-plan.outputs.shards }}
        shell: bash
        run: |
          planned='[]'
          if [ "$SHARDS" = '[]' ]; then planned='["mutants","mutant-costs"]'; fi
          bad=$(jq -r --argjson planned "$planned" 'to_entries[] | select(.value.result != "success") | select(.value.result == "skipped" and (.key as $job | $planned | index($job)) | not) | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "every job passed; skipped only: $planned"
