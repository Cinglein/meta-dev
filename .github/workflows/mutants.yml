name: mutants

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: mutants-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - &cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - id: plan
        run: |
          shards=$(cargo xtask mutants-plan)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  full:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target.noindex
          shared-key: mutants-workspace
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo xtask mutants-full
        timeout-minutes: 7
        env:
          CARGO_INCREMENTAL: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ strategy.job-index }}
          path: target.noindex/mutants
          retention-days: 30

  mutant-costs:
    needs: [plan, full]
    if: ${{ !cancelled() && needs.plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - *cache
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-*
          path: target.noindex/measured
      - run: cargo xtask mutant-costs target.noindex/measured | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash

  mutants-gate:
    needs: [plan, full, mutant-costs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | grep -qE '"result": "(failure|cancelled)"' && exit 1
          echo "every shard passed or none was needed"
