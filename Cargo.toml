[workspace]
resolver = "3"
members = ["crates/*", "self/spec", "tooling/affected", "tooling/build_time", "tooling/corpus_check", "tooling/elegance", "tooling/git_trace", "tooling/lints/*", "tooling/mutant_costs", "tooling/mutation", "tooling/process_tree", "tooling/settings", "tooling/stacked", "tooling/task", "tooling/test_time", "tooling/waterfall", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
meta-schema = { path = "crates/meta-schema" }
meta-log = { path = "crates/meta-log" }
meta-run = { path = "crates/meta-run" }
meta-golden = { path = "crates/meta-golden" }
meta-git = { path = "crates/meta-git" }
meta-git-view = { path = "crates/meta-git-view" }
meta-state = { path = "crates/meta-state" }
meta-gh = { path = "crates/meta-gh" }
meta-listing = { path = "crates/meta-listing" }
meta-status = { path = "crates/meta-status" }
meta-severity = { path = "crates/meta-severity" }
meta-pulls = { path = "crates/meta-pulls" }
meta-pull-query = { path = "crates/meta-pull-query" }
chrono = { version = "0.4.44", default-features = false, features = ["std", "clock", "serde"] }
serde_json = "1.0.149"
signal-hook = "0.3.18"
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
rustc_lexer = { package = "ra-ap-rustc_lexer", version = "0.174.0" }
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "2.0.119", features = ["full", "parsing", "visit"] }
thiserror = "2.0.20"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.dev.package.libgit2-sys]
opt-level = 3

[profile.dev.package.libz-sys]
opt-level = 3
