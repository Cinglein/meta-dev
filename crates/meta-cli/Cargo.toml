[package]
name = "meta-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "meta"
path = "src/main.rs"

[[bin]]
name = "gh-replay"
path = "src/gh_replay.rs"
required-features = ["replay"]

[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"
test = false

[features]
replay = ["dep:meta-golden"]

[dependencies]
meta-golden = { workspace = true, optional = true }
meta-schema.workspace = true
meta-log.workspace = true
meta-run.workspace = true
meta-git-view.workspace = true
meta-listing.workspace = true
meta-status.workspace = true
meta-pull-query.workspace = true
meta-pulls.workspace = true
meta-state.workspace = true
meta-severity.workspace = true
meta-gh.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
libproc = "0.14.11"

[dev-dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
meta-golden.workspace = true
tempfile.workspace = true

[lints]
workspace = true
