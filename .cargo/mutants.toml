exclude_globs = ["xtask/src/main.rs", "self/spec/src/main.rs"]
exclude_re = [
    "MutantCosts::measure",
    "Task::run",
    "CiStep::timed",
    "Ci::run",
    "Stranding::refuse_stranded",
    "LocalGate::run",
    "Clippy::run",
    "Test::run",
    "TestTime::run",
    "TestRunner::run",
    "TestBinary::timed",
    "Changes::(reaches|since_main)",
    "Stacked::",
    "Scope::(applied|changed_shards|shard_runs|write_diff)",
    "CrateLoad::listed",
    "ShardPlan::changed_lines",
    "TriggerEvent::current",
    "Mutants::run",
    "Mutants::refuse_if_another_run_exists",
    "Mutants::refuse_if_memory_is_short",
    "MutantsRun::accepted",
    "MemoryWatch<'policy>::(sample|enforce|grown|children_outside)",
]
minimum_test_timeout = 10.0
cap_lints = false
