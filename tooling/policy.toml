vague = [
    "with", "from", "into", "for", "get", "set", "make", "check", "build", "create", "init",
    "process", "handle", "helper", "util", "data", "value", "item", "thing", "execute",
    "perform", "update", "compute", "manage",
]
wire_types = [
    "serde_json::Value",
    "toml::Value",
    "serde_yaml::Value",
    "rust_decimal::Decimal",
    "bigdecimal::BigDecimal",
    "num_bigint::BigInt",
    "num_bigint::BigUint",
    "std::any::Any",
    "core::any::Any",
]
bit_boundary = []
gate = "local-gate"
gate_wait = 600000
surfaces = [
    "xtask",
    ".cargo",
    "Cargo.toml",
    "clippy.toml",
    ".clippy.toml",
    "rustfmt.toml",
    ".rustfmt.toml",
    "rust-toolchain",
    "rust-toolchain.toml",
    "tooling",
    "self/lint-baseline.toml",
    "meta.toml",
    ".claude",
    ".github",
    "plugin",
    "self/spec",
]

[spec]
package = "meta-spec"
file = "context/SPEC.md"

[branches]
default = "main"
base = "origin/main"

[limits]
parameters = 4
nesting = 2
reexports = 8
private_fns_per_type = 4
edges_per_vertex = 4
tests_per_file = 3
assertions_per_test = 3
lines_per_test = 20
literals_per_test = 4
largest_integer = 64
slowest_shown = 5

[floors]
fn_name = 3
lifetime_name = 2
cut_side = 5
price_sample = 30
diff_factor = 3

[shares]
tests_per_hundred_files = 40
cut_conductance = 19
shard_headroom = 60

[memory_gib]
granted = 5
reserve = 1
per_compiler_task = 2
for_the_tests = 1

[millis]
sample_every = 20
discover_every = 100
per_crate = 21500
test_timeout = 30000
job_setup = 90000

[mutation]
full_run = ["every_main_push", "weekly", "on_demand"]

[domains.features-and-maintenance]
crates = ["*"]
paths = ["*"]

[domains.performance-and-cost]
tests = ["*"]
workflows = ["*"]

[budgets.test-time]
division = "performance-and-cost"
measure = "test_wall_time"
allowance = { duration = 4000 }
window = "per_change"
source = "ci"

[budgets.slowest-test]
division = "performance-and-cost"
measure = "slowest_test"
allowance = { duration = 1000 }
window = "per_change"
source = "ci"

[budgets.mutants-full-job]
division = "performance-and-cost"
measure = { workflow_wall_time = "full_job" }
allowance = { duration = 480000 }
window = "per_change"
source = "ci"

[budgets.mutants-diff-job]
division = "performance-and-cost"
measure = { workflow_wall_time = "diff_job" }
allowance = { duration = 360000 }
window = "per_change"
source = "ci"

[budgets.mutant-price]
division = "performance-and-cost"
measure = "mutant_price"
allowance = { share = 100 }
tolerance = 25
window = "per_change"
source = "ci"

[budgets.lint-findings]
division = "features-and-maintenance"
measure = "lint_findings"
allowance = { baseline = "self/lint-baseline.toml" }
window = "per_change"
source = "ci"

[budgets.test-line-share]
division = "features-and-maintenance"
measure = "test_line_share"
allowance = { share = 18 }
window = "per_change"
source = "ci"

[budgets.tangle-items]
division = "features-and-maintenance"
measure = "tangle_items"
allowance = { count = 83 }
window = "per_change"
source = "ci"

[mutant_millis]
default = 11000

[mutant_millis.crates]
affected = 1700
crate_graph = 2800
expression_flow = 1700
fn_shape = 1600
meta-cli = 3400
meta-log = 4600
meta-pull-query = 2700
meta-pulls = 3200
meta-schema = 7000
meta-severity = 11000
meta-state = 6700
meta-status = 3500
meta-xtask = 1400
module_nesting = 1400
mutant_costs = 2000
mutation = 1400
no_forwarders = 2000
no_parameter_bags = 2200
primitive_boundary = 1600
settings_shape = 2400
state_graph = 2000
task = 5200
test_budget = 2100
test_time = 1900
