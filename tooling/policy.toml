measure = { build_wall_time = { touched = "crates/meta-cli/tests/it/status.rs" } }
allowance = { duration = 397 }
window = "per_change"
source = "ci"
overspend = "report"

[budgets.mutant-price]
division = "performance-and-cost"
measure = "mutant_price"
allowance = { share = 100 }
tolerance = 25
window = "per_change"
source = "ci"

[budgets.lint-findings]
division = "features-and-maintenance"
