vague = [
    "with", "from", "into", "for", "get", "set", "make", "check", "build", "create", "init",
    "process", "handle", "helper", "util", "data", "value", "item", "thing", "execute",
    "perform", "update", "compute", "manage",
]
wire_types = [
    "serde_json::Value",
    "toml::Value",
    "serde_yaml::Value",
    "rust_decimal::Decimal",
    "bigdecimal::BigDecimal",
    "num_bigint::BigInt",
    "num_bigint::BigUint",
    "std::any::Any",
    "core::any::Any",
]
bit_boundary = ["crates/meta-cli/src/request/local/local_clone/vetting/host/process_table"]
gate = "local-gate"
gate_wait = 600000
surfaces = [
    "xtask",
    ".cargo",
    "Cargo.toml",
    "clippy.toml",
    ".clippy.toml",
    "rustfmt.toml",
    ".rustfmt.toml",
    "rust-toolchain",
    "rust-toolchain.toml",
    "tooling",
    "self/lint-baseline.toml",
    "meta.toml",
    ".claude",
    ".github",
    "plugin",
    "self/spec",
]

[spec]
package = "meta-spec"
file = "context/SPEC.md"

[branches]
default = "main"
base = "origin/main"

[supply_chain]
licenses = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0"]
registries = ["https://github.com/rust-lang/crates.io-index"]
git = []
ignored_advisories = []
duplicates = "warn"
semver = ["meta-xtask"]

[limits]
parameters = 4
nesting = 2
reexports = 8
private_fns_per_type = 4
edges_per_vertex = 4
tests_per_file = 3
assertions_per_test = 3
lines_per_test = 20
literals_per_test = 4
largest_integer = 64
slowest_shown = 5
reference_spawns = 1000
types_per_method_shape = 2

[floors]
fn_name = 3
lifetime_name = 2
cut_side = 5
price_sample = 30
diff_factor = 3

[shares]
tests_per_hundred_files = 40
cut_conductance = 19
shard_headroom = 60

[memory_gib]
granted = 5
reserve = 1
per_compiler_task = 2
for_the_tests = 1

[millis]
sample_every = 20
discover_every = 100
per_crate = 21000
test_timeout = 30000
job_setup = 90000

[mutation]
full_run = ["every_main_push", "weekly", "on_demand"]

[domains.features-and-maintenance]
crates = ["*"]
paths = ["*"]

[domains.performance-and-cost]
tests = ["*"]
workflows = ["*"]

[budgets.test-cpu-time]
division = "performance-and-cost"
measure = "test_cpu_time"
allowance = { duration = 4000 }
window = "per_change"
source = "ci"

[budgets.test-time]
division = "performance-and-cost"
measure = "test_wall_time"
allowance = { duration = 8000 }
window = "per_change"
source = "ci"

[budgets.git-processes]
division = "performance-and-cost"
measure = "git_processes"
allowance = { count = 856 }
window = "per_change"
source = "ci"
overspend = "report"

[budgets.git-starters]
division = "performance-and-cost"
measure = "git_starters"
allowance = { count = 19 }
window = "per_change"
source = "ci"

[budgets.slowest-test]
division = "performance-and-cost"
measure = "slowest_test"
allowance = { duration = 1000 }
window = "per_change"
source = "ci"

[budgets.mutants-full-job]
division = "performance-and-cost"
measure = { workflow_wall_time = "full_job" }
allowance = { duration = 480000 }
window = "per_change"
source = "ci"

[budgets.mutants-diff-job]
division = "performance-and-cost"
measure = { workflow_wall_time = "diff_job" }
allowance = { duration = 360000 }
