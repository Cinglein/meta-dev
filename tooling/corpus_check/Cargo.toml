named_numbers = { path = "../lints/named_numbers" }
no_comments = { path = "../lints/no_comments" }
no_forwarders = { path = "../lints/no_forwarders" }
no_free_fns = { path = "../lints/no_free_fns" }
no_numbers_in_binaries = { path = "../lints/no_numbers_in_binaries" }
