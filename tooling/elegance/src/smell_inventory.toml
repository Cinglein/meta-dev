# Smell inventory for Cinglein/meta-dev, main 517e2f80 (2026-10-29).
# Hand-checked against a fresh clone. Coarse ground truth for scoring elegance-lint ideas.
# Every location below was opened and read. Entries that could not be confirmed were dropped.
#
# Categories (fixed list):
#   duplicate-path       one external effect (git, gh, kill, lsof, env scrub) reached by several code paths
#   duplicate-parser     one external text format parsed by several independent parsers
#   duplicate-logic      the same body or algorithm written again per type or per crate
#   near-duplicate-type  types with near-identical fields and behaviour (or one concept split into several types)
#   parallel-tables      an enum with several hand-written matches or string tables that must stay in sync
#   missing-trait        a method family shared by many types, or a delegation layer, with no trait naming it
#   hidden-state         mode fields, late-filled Options, or caches that change what later calls do
#   low-cohesion         one type or trait carrying disjoint responsibilities (reads + writes, text + I/O)
#   god-type             a type, enum or crate that most of the system routes through
#   primitive-domain     domain values as String, u32, Option<()> or ad-hoc string encodings
#   effect-in-core       clock, randomness, fs, env or process inside otherwise pure code, parsers or queries
#   fake                 hand-written test double of a seam trait
#   unsafe-destructive   destructive effect with no compare-and-swap or freshness check, or with its failure swallowed
#   fail-open            a check or read that cannot decide and silently proceeds with a default
#   name-collision       one type name used for unrelated concepts across the workspace
#
# Measure keys (from algebra/formalization.md):
#   naming-completeness  P1 unnamed concepts of the behaviour lattice
#   orthogonality        P3 signature declared in more than one trait
#   leverage             P4 usable methods / written bodies
#   behavioural-inherent P6 behaviour-bearing inherent methods
#   bisimilar-pairs      P7 bisimilar type pairs in the transition graph
#   primitive-edges      P7 domain transitions touching primitive nodes
#   typestate-share      P7 share of transitions that consume self into another type
#   generic-over-concrete P8 bodies identical up to types
#   one-path-per-effect  P9 distinct call paths ending in one external effect
#   hidden-state         "no implicit state": mutable mode fields and late-filled options
#   hub-degree           graph simplicity: degree distribution / god nodes / crate modularity
#   failure-nodes        graph simplicity: failure states as explicit nodes
#   field-concepts       FCA over (type x field) shared field sets
#   lcom4                cohesion: components of the method-field usage graph
#   "none yet"           no proposed measure would flag it
#
# confidence: clear = reviewer would agree on sight; likely = real but arguable or partly justified.

