[package]
name = "task"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
derive_more = { version = "2", features = ["add", "add_assign", "display", "from", "from_str", "into", "sum"] }
enum-map = { version = "3", features = ["serde"] }
meta-schema = { path = "../../crates/meta-schema" }
meta-severity = { path = "../../crates/meta-severity" }
meta-state = { path = "../../crates/meta-state" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settings = { path = "../settings" }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "2", features = ["extra-traits", "full", "parsing", "visit"] }
process_tree = { path = "../process_tree" }
thiserror = "2"
toml = "0.9"

[features]
test-policy = []

[lints]
workspace = true
