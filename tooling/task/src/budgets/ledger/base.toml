[budgets.t-open-tasks]
division = "features-and-maintenance"
measure = { open_items = { kind = "task" } }
allowance = { count = 4 }
window = "standing"

[budgets.t-tangle]
division = "features-and-maintenance"
measure = "tangle_items"
allowance = { count = 4 }
window = "standing"

[budgets.t-gone]
division = "features-and-maintenance"
measure = { open_items = { kind = "issue" } }
allowance = { count = 0 }
window = "standing"

[budgets.t-extra]
division = "performance-and-cost"
measure = "test_wall_time"
allowance = { duration = 1 }
window = "per_change"
source = "ci"
