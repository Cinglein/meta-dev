
[domains."features-and-maintenance/nav"]
paths = ["crates*"]

[budgets.t-nav-words]
division = "features-and-maintenance/nav"
measure = "words"
allowance = { of = "prose-words", count = 2 }
window = "standing"

[budgets.t-verbose]
division = "features-and-maintenance"
measure = { open_items = { verbose = 3 } }
allowance = { count = 4 }
window = "standing"

[budgets.t-open-tasks]
division = "features-and-maintenance"
measure = { open_items = { kind = "task" } }
allowance = { count = 6 }
window = "standing"

[budgets.t-nav-tasks]
division = "features-and-maintenance/nav"
measure = { open_items = { kind = "task" } }
allowance = { of = "t-open-tasks", count = 1 }
window = "standing"

[budgets.t-unheld]
division = "features-and-maintenance"
measure = { open_items = "unheld_tasks" }
allowance = { count = 5 }
window = "standing"

[budgets.t-nav-unheld]
division = "features-and-maintenance/nav"
measure = { open_items = "unheld_tasks" }
allowance = { of = "t-unheld", count = 3 }
window = "standing"

[budgets.t-nav-concerns]
division = "features-and-maintenance/nav"
measure = { open_items = { kind = "concern" } }
allowance = { of = "t-concerns", count = 0 }
window = "standing"

[budgets.t-cost-tasks]
division = "performance-and-cost"
measure = { open_items = { kind = "task" } }
allowance = { count = 9 }
window = "standing"

[budgets.t-discussion]
division = "features-and-maintenance"
measure = { open_items = "in_discussion" }
allowance = { count = 2 }
window = "standing"

[budgets.t-concerns]
division = "features-and-maintenance"
measure = { open_items = { kind = "concern" } }
allowance = { count = 5 }
window = "standing"

[budgets.t-cost-concerns]
division = "performance-and-cost"
measure = { open_items = { kind = "concern" } }
allowance = { count = 0 }
window = "standing"

[budgets.t-planning-issues]
division = "architecture-and-planning"
measure = { open_items = { kind = "issue" } }
allowance = { count = 0 }
window = "standing"

[[scales."features-and-maintenance/nav"]]
name = "lost"
meaning = "x"
parent = "critical"

[[scales."features-and-maintenance/nav"]]
name = "slow"
meaning = "x"
parent = "major"

[[scales."features-and-maintenance/nav"]]
name = "typo"
meaning = "x"
parent = "minor"