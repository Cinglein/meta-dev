[budgets.t-open-tasks]
division = "features-and-maintenance"
measure = { open_items = { kind = "task" } }
allowance = { count = 4 }
window = "standing"

[domains."features-and-maintenance/nav"]
paths = ["README*"]

[budgets.t-words]
division = "features-and-maintenance"
measure = "words"
allowance = { count = 9 }
window = "standing"

[budgets.t-nav-docs]
division = "features-and-maintenance/nav"
measure = "words"
allowance = { of = "t-words", count = 3 }
window = "standing"

[budgets.t-gone]
division = "features-and-maintenance"
measure = { open_items = { kind = "issue" } }
allowance = { count = 0 }
window = "standing"

[budgets.t-extra]
division = "performance-and-cost"
measure = "test_wall_time"
allowance = { duration = 1 }
window = "per_change"
source = "ci"
